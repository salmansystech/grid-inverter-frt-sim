name: test-matrix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b

      - name: Run fault scenarios
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('scripts'); run_test_matrix('plots', true)

      - name: Upload plots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-matrix-results
          path: results/
